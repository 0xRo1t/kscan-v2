  author: adeljck
  severity: critical
  description: 蚁剑直接连接 http://x.x.x.x/webroot/aaa.jsp?a=javax.script.ScriptEngineManager  连接密码是 b    类型是 jspjs
  reference:
    - https://mp.weixin.qq.com/s/AliftiLevjz5HB9uL0DOqQ
