id: minio-console-login-minioadmin

info:
  name: MinIO Console Login Panel - Detect
  author: pussycat0x
  severity: high
  description: MinIO Console login panel was detected.
  metadata:
    max-request: 1
    shodan-query: title:"MinIO Console"
    fofa-query: app="MinIO-Console"
    product: console
    vendor: minio
  tags: minio

http:
  - raw:
      - |
        POST /api/v1/login HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/json
        Content-Length: 51
        Connection: keep-alive
        Cookie: JSESSIONID=53DE9789A4C04756235EA449ED62BF2C; atlassian.xsrf.token=B1YA-IG2S-RMG8-0VA8|a74677852ee767b18a1598c67069c93a6d618d8a|lout
        Priority: u=0

        {"accessKey":"minioadmin","secretKey":"minioadmin"}
    matchers:
      - type: status
        status:
          - 204
